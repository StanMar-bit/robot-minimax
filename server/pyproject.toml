[project]
name = "robot-minimax-server"
version = "0.1.0"
description = "Game server for the NAO minimax demo (IAI1, adversarial search)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-socketio>=5.11",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5.11",
    "aiohttp>=3.10",
    "requests>=2.32",
    "pyzmq>=26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
